<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}ABUTRON FX V9{% endblock %}</title>
  <style>
    :root {
      --bg:#071018; --bg-2:#0b1622; --panel:#0f1c2a; --panel-2:#122434;
      --line:#1d3145; --line-2:#25405c; --fg:#e8f1fb; --muted:#8aa4bd;
      --acc:#4ea8ff; --acc-2:#7cc0ff;
      --ok:#37d98a; --ok-bg:rgba(55,217,138,.12);
      --warn:#f0b840; --warn-bg:rgba(240,184,64,.12);
      --bad:#f8616b; --bad-bg:rgba(248,97,107,.12);
      --info:#8b8bff; --info-bg:rgba(139,139,255,.12);
      --radius:12px; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
    }
    * { box-sizing:border-box; }
    html,body { margin:0; }
    body { font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
           background:radial-gradient(1200px 600px at 80% -10%, #10233a 0%, transparent 60%),
                      radial-gradient(900px 500px at -10% 0%, #0c2030 0%, transparent 55%), var(--bg);
           color:var(--fg); min-height:100vh; line-height:1.5; }
    a { color:var(--acc-2); text-decoration:none; }
    a:hover { text-decoration:underline; }

    /* ---- top bar ---- */
    header.topbar { position:sticky; top:0; z-index:30;
      background:linear-gradient(180deg, rgba(7,16,24,.92), rgba(7,16,24,.72));
      backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
    .topbar-inner { max-width:1320px; margin:0 auto; padding:0 24px;
      display:flex; align-items:center; gap:28px; height:60px; }
    .brand { display:flex; align-items:center; gap:11px; }
    .brand .mark { width:34px; height:34px; border-radius:9px; display:grid;
      place-items:center; font-weight:800; font-size:18px; color:#04121e;
      background:linear-gradient(140deg, var(--acc), #2f7fe0); box-shadow:0 4px 14px rgba(78,168,255,.35); }
    .brand .mark span { color:#fff; }
    .brand .name { font-weight:700; letter-spacing:.3px; }
    .brand .name small { display:block; font-weight:500; font-size:10px;
      letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
    .nav { display:flex; gap:4px; margin-left:8px; }
    .nav a { padding:8px 14px; border-radius:8px; color:var(--muted);
      font-size:14px; font-weight:600; text-decoration:none; }
    .nav a:hover { color:var(--fg); background:var(--panel); text-decoration:none; }
    .nav a.active { color:#fff; background:linear-gradient(180deg,var(--panel-2),var(--panel));
      box-shadow:inset 0 0 0 1px var(--line-2); }
    .topbar .spacer { flex:1; }
    .pill { display:inline-flex; align-items:center; gap:7px; padding:5px 11px;
      border-radius:999px; font-size:12px; font-weight:700; border:1px solid var(--line-2);
      background:var(--panel); color:var(--muted); }
    .pill .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
    .pill.ok { color:var(--ok); background:var(--ok-bg); border-color:transparent; }
    .pill.ok .dot { background:var(--ok); }
    .pill.warn { color:var(--warn); background:var(--warn-bg); border-color:transparent; }
    .pill.warn .dot { background:var(--warn); }
    .pill.bad { color:var(--bad); background:var(--bad-bg); border-color:transparent; }
    .pill.bad .dot { background:var(--bad); }

    main.wrap { max-width:1320px; margin:0 auto; padding:28px 24px 60px; }

    /* ---- hero / eyebrow ---- */
    .eyebrow { font-size:11px; font-weight:700; letter-spacing:2.5px;
      text-transform:uppercase; color:var(--acc-2); }
    .hero { padding:8px 0 4px; }
    .hero h1 { font-size:30px; margin:6px 0 8px; letter-spacing:-.4px; }
    .hero h1 em { font-style:normal; color:var(--acc-2); }
    .hero p { color:var(--muted); max-width:760px; margin:0; }
    .notice { display:flex; gap:11px; align-items:flex-start; margin-top:16px;
      padding:12px 15px; border-radius:var(--radius); border:1px solid var(--line);
      background:linear-gradient(180deg,var(--panel),var(--bg-2)); font-size:13.5px; }
    .notice .nd { width:9px; height:9px; border-radius:50%; margin-top:6px; flex:none;
      background:var(--warn); box-shadow:0 0 0 4px var(--warn-bg); }

    /* ---- stats ---- */
    .stats { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
      margin:20px 0; }
    .stat { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
      padding:15px 16px; box-shadow:var(--shadow); }
    .stat span { display:block; font-size:11px; font-weight:700; letter-spacing:1.4px;
      text-transform:uppercase; color:var(--muted); }
    .stat b { display:block; font-size:25px; margin:5px 0 2px; letter-spacing:-.5px; }
    .stat small { color:var(--muted); font-size:12.5px; }

    /* ---- cards / grid ---- */
    .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
      padding:18px; box-shadow:var(--shadow); }
    .card h3 { margin:0 0 4px; font-size:16px; }
    .card .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
    .card .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .muted { color:var(--muted); }
    .section-title { display:flex; align-items:center; justify-content:space-between;
      margin:28px 0 14px; }
    .section-title h2 { font-size:18px; margin:0; }
    .section-title .hint { color:var(--muted); font-size:13px; }

    /* ---- tables ---- */
    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:1px;
      color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); }
    td { padding:9px 10px; border-bottom:1px solid var(--line); }
    tr:last-child td { border-bottom:0; }
    .tbl-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius);
      background:var(--panel); }

    /* ---- forms ---- */
    label { display:block; font-size:12.5px; color:var(--muted); margin:0 0 4px; font-weight:600; }
    input, select { width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line-2);
      background:var(--bg-2); color:var(--fg); font-size:14px; font-family:inherit; }
    input:focus, select:focus { outline:none; border-color:var(--acc);
      box-shadow:0 0 0 3px rgba(78,168,255,.18); }
    .field { margin-bottom:13px; }
    .form-row { display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); }

    /* ---- buttons ---- */
    button, .btn { display:inline-flex; align-items:center; gap:7px; border:0; border-radius:8px;
      padding:9px 15px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit;
      background:var(--acc); color:#04121e; transition:transform .04s ease, filter .15s ease; }
    button:hover, .btn:hover { filter:brightness(1.08); }
    button:active { transform:translateY(1px); }
    button.sec { background:var(--panel-2); color:var(--fg); border:1px solid var(--line-2); }
    button.ok { background:var(--ok); color:#04121e; }
    button.danger { background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad); }
    button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line-2); }
    button.sm { padding:6px 11px; font-size:12.5px; }
    button[disabled] { opacity:.5; cursor:not-allowed; }

    /* ---- toast ---- */
    #toasts { position:fixed; bottom:22px; right:22px; z-index:80; display:flex;
      flex-direction:column; gap:10px; }
    .toast { min-width:260px; max-width:380px; padding:12px 15px; border-radius:10px;
      background:var(--panel-2); border:1px solid var(--line-2); box-shadow:var(--shadow);
      font-size:13.5px; animation:tin .2s ease; }
    .toast.ok { border-color:var(--ok); } .toast.ok b { color:var(--ok); }
    .toast.bad { border-color:var(--bad); } .toast.bad b { color:var(--bad); }
    @keyframes tin { from { opacity:0; transform:translateY(8px); } }

    .empty { padding:34px; text-align:center; color:var(--muted);
      border:1px dashed var(--line-2); border-radius:var(--radius); }
    .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; }
    .kv dt { color:var(--muted); } .kv dd { margin:0; }
    @media (max-width:720px){ .nav { display:none; } .hero h1 { font-size:24px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="mark">A<span>◆</span></div>
        <div class="name">ABUTRON<small>FX V9 · APEX 1.1</small></div>
      </div>
      <nav class="nav">
        <a href="/client" class="{{ 'active' if active=='client' }}">Client</a>
        <a href="/admin" class="{{ 'active' if active=='admin' }}">Admin</a>
        <a href="/command" class="{{ 'active' if active=='command' }}">Command</a>
      </nav>
      <div class="spacer"></div>
      {% block topright %}{% endblock %}
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <div id="toasts"></div>
  <script>
    const ABUTRON = {
      async api(url, opts = {}) {
        const r = await fetch(url, { headers: {'Content-Type':'application/json'}, ...opts });
        let body = null;
        try { body = await r.json(); } catch (e) {}
        if (!r.ok) {
          const detail = (body && (body.detail || body.error)) || `HTTP ${r.status}`;
          const err = new Error(detail); err.status = r.status; err.body = body;
          throw err;
        }
        return body;
      },
      toast(msg, kind = 'ok') {
        const el = document.createElement('div');
        el.className = 'toast ' + kind;
        el.innerHTML = `<b>${kind === 'bad' ? '✕' : '✓'}</b> ${msg}`;
        document.getElementById('toasts').appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3200);
        setTimeout(() => el.remove(), 3600);
      },
      esc(s) { return String(s ?? '').replace(/[&<>"]/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
