name: ABUTRON Python Full Suite (Isolated CI)

on:
  push:
    branches:
      - arena/a097f5f5-abutron-fx-v9
  pull_request:
    branches:
      - main
      - arena/a097f5f5-abutron-fx-v9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-pytest:
    name: Full pytest suite — fresh pinned environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up clean Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact declared requirements in ephemeral runner
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Report resolved test dependency versions
        run: |
          python - <<'PY'
          import importlib.metadata as m
          for name in ('fastapi', 'starlette', 'httpx', 'jinja2', 'python-multipart', 'pytest'):
              print(f'{name}=={m.version(name)}')
          PY

      - name: Run complete Python suite (no exclusions)
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q --junitxml="${{ runner.temp }}/abutron-full-pytest.xml"

      - name: Retain full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abutron-full-pytest-results
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/abutron-full-pytest.xml
