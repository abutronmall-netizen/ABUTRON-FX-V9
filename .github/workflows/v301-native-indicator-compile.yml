name: ABUTRON V3.01 Read-Only Indicator MetaEditor Compile (QA Only)

on:
  push:
    branches: [arena/a097f5f5-abutron-fx-v9]
    paths:
      - 'mql5/ApexMarketFeedV3.mq5'
      - '.github/workflows/v301-native-indicator-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-readonly-v3:
    name: Compile V3.01 with signed MetaEditor (offline only)
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - name: Assert source contains no order functions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source='mql5/ApexMarketFeedV3.mq5'
          if (-not (Test-Path -LiteralPath $source)) { throw 'V3 source missing' }
          $code=Get-Content -LiteralPath $source -Raw
          if ($code -match '(?i)\b(OrderSend|OrderCheck|PositionModify|TRADE_ACTION_DEAL|TRADE_ACTION_PENDING)\s*\(') {
            throw 'Order operation found in V3 read-only indicator'
          }

      - name: Install official signed MetaEditor in isolated QA runner
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $setup=Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $setup
          $sig=Get-AuthenticodeSignature -FilePath $setup
          if ($sig.Status -ne 'Valid' -or $null -eq $sig.SignerCertificate -or
              $sig.SignerCertificate.Subject -notmatch 'MetaQuotes') {
            throw 'Invalid MetaQuotes installer signature'
          }
          $install=Join-Path $env:RUNNER_TEMP 'AbutronV301CompilerQA'
          New-Item -ItemType Directory -Force -Path $install | Out-Null
          $proc=Start-Process -FilePath $setup -ArgumentList @('/auto',('/path:"{0}"' -f $install)) -Wait -PassThru
          if (-not (Test-Path -LiteralPath (Join-Path $install 'metaeditor64.exe'))) {
            throw "Isolated MetaEditor installation failed (installer exit $($proc.ExitCode))"
          }

      - name: Compile V3.01 indicator and record SHA256
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $compiler=Join-Path $env:RUNNER_TEMP 'AbutronV301CompilerQA/metaeditor64.exe'
          $source=Join-Path $env:GITHUB_WORKSPACE 'mql5/ApexMarketFeedV3.mq5'
          $log=[IO.Path]::ChangeExtension($source,'.log')
          $ex5=[IO.Path]::ChangeExtension($source,'.ex5')
          & $compiler "/compile:$source" '/log'
          $limit=(Get-Date).AddMinutes(3)
          $report=''
          while ((Get-Date) -lt $limit) {
            if (Test-Path -LiteralPath $log) {
              $report=Get-Content -LiteralPath $log -Encoding Unicode -Raw
              if ($report -match '(?mi)^Result:') { break }
            }
            Start-Sleep -Milliseconds 750
          }
          Write-Host $report
          if ($report -notmatch '(?mi)Result:\s*0 errors,\s*0 warnings') {
            throw 'Native V3.01 MetaEditor compilation failed'
          }
          if (-not (Test-Path -LiteralPath $ex5)) {
            throw 'Compiler succeeded without V3 EX5 output'
          }
          $sha=(Get-FileHash -LiteralPath $ex5 -Algorithm SHA256).Hash.ToLowerInvariant()
          "ApexMarketFeedV3.ex5 SHA256 $sha" |
            Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'mql5/ApexMarketFeedV3.ex5.sha256.txt')
          Write-Host "V301_READONLY_EX5_SHA256=$sha"
          Write-Host 'Isolated CI build only; no broker login, terminal attachment, or production deployment.'

      - name: Upload signed compiler diagnostics and EX5 for offline QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abutron-v301-native-indicator-metaeditor-qa
          retention-days: 7
          if-no-files-found: warn
          path: |
            mql5/ApexMarketFeedV3.log
            mql5/ApexMarketFeedV3.ex5
            mql5/ApexMarketFeedV3.ex5.sha256.txt

      - name: Pin compiled V3 SHA256 on push branch
        if: success() && github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pin='mql5/ApexMarketFeedV3.ex5.sha256.txt'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if (-not (git status --porcelain -- $pin)) { exit 0 }
          git add $pin
          git commit -m "ci(v301): pin compiled read-only indicator SHA256"
          git push
