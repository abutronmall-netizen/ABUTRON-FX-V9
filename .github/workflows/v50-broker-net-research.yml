name: V50 Broker-Net Reward Research
on:
  pull_request:
    paths:
      - "src/abutron/brain/net_reward49.py"
      - "scripts/train_broker_net_reward49.py"
      - "tests/test_net_reward49.py"
      - ".github/workflows/v50-broker-net-research.yml"
  workflow_dispatch:

jobs:
  research-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.1 pytest==8.3.4
      - name: Check syntax
        run: python -m py_compile src/abutron/brain/net_reward49.py scripts/train_broker_net_reward49.py tests/test_net_reward49.py
      - name: Test native broker-net research semantics
        env:
          PYTHONPATH: src
        run: python -m pytest -q -p no:cacheprovider tests/test_net_reward49.py
